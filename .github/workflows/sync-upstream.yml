name: Sync fork with upstream

on:
  schedule:
    # Every 6 hours, every day (UTC)
    # This upstream repo is very active (automated bot commits),
    # frequent syncing keeps the fork close to upstream at all times
    - cron: "5 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting fast-forward sync..."
          if ! gh repo sync ${{ github.repository }} -b master; then
            echo "Fast-forward failed (diverged fork?), performing hard reset..."
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
            cd repo
            git remote add upstream https://github.com/awesome-selfhosted/awesome-selfhosted.git
            git fetch upstream master
            git checkout master
            git reset --hard upstream/master
            git push origin master --force
          else
            echo "Fast-forward sync completed."
          fi
